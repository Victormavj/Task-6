<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Cost Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="calculator">
        <h1>Service Cost Calculator</h1>
        <form id="calculatorForm">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1">

            <fieldset>
                <legend>Select a product:</legend>
                <div id="productList"></div>
            </fieldset>

            <div id="radioOptions" class="extra-options" hidden>
                <label for="serviceOption">Select an option:</label>
                <select id="serviceOption" name="serviceOption"></select>
            </div>

            <div id="checkboxOption" class="extra-options" hidden>
                <div id="propertyOption"></div>
            </div>
        </form>
        <p id="result" aria-live="polite">Total cost: $10.00</p>
    </main>
</body>
</html>
